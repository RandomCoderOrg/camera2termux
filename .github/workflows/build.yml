name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Fetch public Termux GitHub signing key
        run: |
          curl -fsSL https://raw.githubusercontent.com/termux/termux-app/8629e632fcb95da272221be327db653fb24befe9/app/testkey_untrusted.jks -o termux-testkey.jks
          echo 'a2ba19f2417de94dd3bdfb6ceece070cdc5f9b492af09cd5900058e860b18c7d  termux-testkey.jks' | sha256sum -c -
      - name: Build APK and Termux native library from source
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          make -C fauxdev test
          ./gradlew :app:assembleRelease
          bash scripts/build-termux.sh
      - name: Compile-check Studio source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-declarative-dev libswscale-dev
          cmake -S studio -B build/studio-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/studio-host --parallel 2
      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk |
            grep -F 'b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1'
          for arch in arm64 arm i686 x86_64; do
            cp app/build/outputs/apk/release/app-release.apk "dist/$arch/camera2termux.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: camera2termux-arm64-${{ github.sha }}
          path: dist/arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: camera2termux-arm-${{ github.sha }}
          path: dist/arm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: camera2termux-i686-${{ github.sha }}
          path: dist/i686/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: camera2termux-x86_64-${{ github.sha }}
          path: dist/x86_64/
          if-no-files-found: error
